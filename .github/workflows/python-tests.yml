name: Python Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test-python-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install chart-visualization dependencies
        run: |
          cd skills/chart-visualization/tests
          pip install -r requirements.txt
      
      - name: Run chart-visualization tests
        run: |
          cd skills/chart-visualization/tests
          python -m unittest test_generate.py -v
      
      - name: Install icon-retrieval dependencies
        run: |
          cd skills/icon-retrieval/tests
          # icon-retrieval has no external dependencies, just verify requirements.txt exists
          if [ -f requirements.txt ]; then
            echo "requirements.txt found"
          fi
      
      - name: Run icon-retrieval tests
        run: |
          cd skills/icon-retrieval/tests
          python -m unittest test_search.py -v
