<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AntV Skills</title>
  <link rel="icon" href="https://mdn.alipayobjects.com/huamei_qa8qxu/afts/img/A*FBLnQIAzx6cAAAAAQDAAAAgAemJ7AQ/original">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@antv/g2@5.4.8/dist/g2.min.js"></script>
  <script src="https://unpkg.com/@antv/g6@5.0.42/dist/g6.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
  <style>
    /* ── Design tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg-app:        #f5f5f5;
      --bg-sidebar:    #ffffff;
      --bg-surface:    #fafafa;
      --bg-panel:      #f5f5f5;
      --bg-input:      #ffffff;
      --bg-hover:      #f0f0f0;
      --bg-active:     #ebebeb;

      --border:        #e4e4e7;
      --border-subtle: #eeeeee;
      --border-focus:  #6366f1;

      --text-primary:  #111111;
      --text-secondary:#555555;
      --text-tertiary: #999999;
      --text-inverse:  #ffffff;

      --accent:        #6366f1;
      --accent-hover:  #818cf8;
      --accent-dim:    rgba(99,102,241,0.15);

      --green:         #22c55e;
      --green-dim:     rgba(34,197,94,0.12);
      --red:           #ef4444;
      --red-dim:       rgba(239,68,68,0.12);
      --amber:         #f59e0b;
      --amber-dim:     rgba(245,158,11,0.12);
      --purple:        #a855f7;
      --purple-dim:    rgba(168,85,247,0.12);

      --radius-sm:     6px;
      --radius:        8px;
      --radius-lg:     12px;

      --shadow-sm:     0 1px 3px rgba(0,0,0,0.4);
      --shadow:        0 4px 12px rgba(0,0,0,0.5);

      --sidebar-w:     340px;
      --toolbar-h:     48px;
      --panel-header-h: 38px;
      --transition:    all 0.15s ease;
    }

    /* ── Reset ─────────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ────────────────────────────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ───────────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .brand-tag {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-left: 38px;
    }

    /* ── Chat ──────────────────────────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .chat-container::-webkit-scrollbar { width: 4px; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message { animation: fadeUp 0.2s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { display: flex; justify-content: flex-end; }

    .message-content {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .message-content {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message.system .message-content {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 100%;
    }

    .message.error .message-content {
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: var(--radius);
    }

    /* ── Controls row ──────────────────────────────────────────────────────── */
    .controls-bar {
      padding: 10px 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--bg-sidebar);
      flex-shrink: 0;
    }

    .seg-group {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .seg-group label {
      position: relative;
      display: flex;
      align-items: center;
    }

    .seg-group input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .seg-group .seg-label {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      border-right: 1px solid var(--border);
    }

    .seg-group label:last-child .seg-label {
      border-right: none;
    }

    .seg-group input[type="radio"]:checked + .seg-label {
      background: var(--accent-dim);
      color: var(--accent-hover);
    }

    .seg-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
    }

    /* ── Input area ────────────────────────────────────────────────────────── */
    .input-area {
      padding: 12px 14px 14px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .input-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      transition: var(--transition);
      overflow: hidden;
    }

    .input-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .input-box textarea {
      width: 100%;
      padding: 12px 14px 8px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 44px;
      max-height: 120px;
    }

    .input-box textarea::placeholder {
      color: var(--text-tertiary);
    }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 6px 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .hint-text {
      font-size: 11px;
      color: var(--text-tertiary);
      flex: 1;
    }

    .send-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      transition: var(--transition);
    }

    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .send-btn svg { width: 13px; height: 13px; }

    /* ── Main content ──────────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-app);
    }

    /* ── Toolbar ───────────────────────────────────────────────────────────── */
    .toolbar {
      height: var(--toolbar-h);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 6px;
      flex-shrink: 0;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .toolbar-btn svg { width: 13px; height: 13px; }

    .toolbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-focus);
    }

    .toolbar-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .toolbar-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 2px;
    }

    .toolbar-spacer { flex: 1; }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .status-dot .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    /* ── Content area ──────────────────────────────────────────────────────── */
    .content-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Code panel ────────────────────────────────────────────────────────── */
    .code-panel {
      width: 42%;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }

    .panel-header {
      height: var(--panel-header-h);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-panel);
      flex-shrink: 0;
    }

    .panel-header-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      flex: 1;
    }

    .panel-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 500;
    }

    .panel-badge.bm25  { background: var(--accent-dim); color: var(--accent-hover); }
    .panel-badge.tool-call { background: var(--purple-dim); color: var(--purple); }

    .code-editor {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #monacoContainer {
      width: 100%;
      height: 100%;
    }

    /* ── Skills footer ─────────────────────────────────────────────────────── */
    .skills-footer {
      border-top: 1px solid var(--border-subtle);
      padding: 10px 14px;
      background: var(--bg-panel);
      max-height: 140px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .skills-footer-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      list-style: none;
    }

    .skills-list li {
      font-size: 11px;
      padding: 2px 8px;
      background: var(--bg-active);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-secondary);
    }

    /* ── Preview panel ─────────────────────────────────────────────────────── */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
    }

    .preview-placeholder {
      text-align: center;
      color: var(--text-tertiary);
    }

    .preview-placeholder-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-placeholder-icon svg {
      width: 24px;
      height: 24px;
      color: var(--text-tertiary);
    }

    .preview-placeholder p {
      font-size: 13px;
      margin-bottom: 4px;
      color: var(--text-secondary);
    }

    .preview-placeholder small {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    #container {
      width: 100%;
      height: 100%;
      min-height: 400px;
    }

    /* ── Inline error ──────────────────────────────────────────────────────── */
    .error-block {
      padding: 12px 16px;
      background: var(--red-dim);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius);
      color: #fca5a5;
      font-size: 12px;
      margin: 16px;
      font-family: 'Monaco', 'Menlo', monospace;
    }

    /* ── Loading spinner ───────────────────────────────────────────────────── */
    .loading {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--text-secondary);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Mode badge in messages ────────────────────────────────────────────── */
    .mode-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      vertical-align: middle;
      margin-left: 4px;
      text-transform: uppercase;
    }

    .mode-badge.bm25 { background: var(--accent-dim); color: var(--accent-hover); }
    .mode-badge.tool-call { background: var(--purple-dim); color: var(--purple); }

    /* ── Scrollbar global ──────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
  </style>
</head>
<body>
  <div class="app">

    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <aside class="sidebar">

      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 12L8 4L13 12H3Z" fill="currentColor" opacity="0.9"/>
              <circle cx="8" cy="4" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <span class="brand-name">AntV Copilot</span>
        </div>
        <div class="brand-tag">G2 &amp; G6 · RAG · Tool Call</div>
      </div>

      <div class="chat-container" id="chatContainer">
        <div class="message system">
          <div class="message-content">
            描述你想要的图表或图可视化，例如：<br>
            <span style="color:var(--text-tertiary)">• "展示季度销售额的分组柱状图"</span><br>
            <span style="color:var(--text-tertiary)">• "用 G6 画一个力导向布局知识图谱"</span>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <div class="seg-group">
          <label>
            <input type="radio" name="library" value="auto">
            <span class="seg-label">自动</span>
          </label>
          <label>
            <input type="radio" name="library" value="g2" checked>
            <span class="seg-label"><span class="seg-dot"></span>G2</span>
          </label>
          <label>
            <input type="radio" name="library" value="g6">
            <span class="seg-label"><span class="seg-dot"></span>G6</span>
          </label>
        </div>

        <div class="seg-group">
          <label>
            <input type="radio" name="mode" value="bm25">
            <span class="seg-label">BM25</span>
          </label>
          <label>
            <input type="radio" name="mode" value="tool-call" checked>
            <span class="seg-label">Tool Call</span>
          </label>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-box">
          <textarea id="userInput" placeholder="描述你的图表需求…" rows="2"></textarea>
          <div class="input-footer">
            <span class="hint-text">Shift+Enter 换行</span>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
              <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 2L14 8L8 14M2 8H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              发送
            </button>
          </div>
        </div>
      </div>

    </aside>

    <!-- ── Main ─────────────────────────────────────────────────────────── -->
    <main class="main">

      <div class="toolbar">
        <button class="toolbar-btn primary" onclick="runCode()">
          <svg viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3.5L13 8L5 12.5V3.5Z"/>
          </svg>
          运行
        </button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn" onclick="copyCode()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="8" height="9" rx="1.5"/>
            <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v7A1.5 1.5 0 003.5 12H5"/>
          </svg>
          复制
        </button>
        <button class="toolbar-btn" onclick="formatCode()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 4h12M2 8h8M2 12h10" stroke-linecap="round"/>
          </svg>
          格式化
        </button>
        <button class="toolbar-btn" onclick="clearCode()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 4h10M6 4V3h4v1M5 4l1 9h4l1-9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          清空
        </button>
        <div class="toolbar-spacer"></div>
        <div class="status-dot">
          <span class="dot" style="background:var(--text-tertiary);box-shadow:none;"></span>
          <span id="statusDot">就绪</span>
        </div>
      </div>

      <div class="content-area">

        <!-- Code Editor -->
        <div class="code-panel">
          <div class="panel-header">
            <span class="panel-header-label">代码</span>
            <span id="modeBadgePanel" style="display:none;"></span>
          </div>
          <div class="code-editor">
            <div id="monacoContainer"></div>
          </div>
          <div id="skillsInfo" style="display:none;" class="skills-footer">
            <div class="skills-footer-title">已加载 Skills</div>
            <ul class="skills-list" id="skillsList"></ul>
          </div>
        </div>

        <!-- Preview -->
        <div class="preview-panel">
          <div class="panel-header">
            <span class="panel-header-label">预览</span>
          </div>
          <div class="preview-container">
            <div class="preview-placeholder" id="placeholder">
              <div class="preview-placeholder-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="3" y="3" width="18" height="18" rx="3"/>
                  <path d="M3 9h18M9 21V9"/>
                </svg>
              </div>
              <p>运行代码后在此预览</p>
              <small>点击「运行」或修改代码自动触发</small>
            </div>
            <div id="container" style="display:none;"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    /* ── State ──────────────────────────────────────────────────────────────── */
    let chartInstance   = null;
    let graphInstance   = null;
    let autoRunTimer    = null;
    let monacoEditor    = null;
    let isSettingValue  = false;

    /* ── Monaco Editor ──────────────────────────────────────────────────────── */
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monacoEditor = monaco.editor.create(document.getElementById('monacoContainer'), {
        value: '// 生成的代码将显示在这里\n// 点击「发送」开始生成',
        language: 'javascript',
        theme: 'vs',
        fontSize: 13,
        lineHeight: 22,
        fontFamily: "'Monaco', 'Menlo', 'JetBrains Mono', 'Fira Code', monospace",
        fontLigatures: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        wordWrap: 'on',
        padding: { top: 12, bottom: 12 },
        renderLineHighlight: 'gutter',
        scrollbar: { verticalScrollbarSize: 5, horizontalScrollbarSize: 5 },
      });

      monacoEditor.onDidChangeModelContent(() => {
        if (isSettingValue) return;
        clearTimeout(autoRunTimer);
        autoRunTimer = setTimeout(() => {
          if (monacoEditor.getValue().trim()) runCode();
        }, 1000);
      });
    });

    /* ── Chat input ─────────────────────────────────────────────────────────── */
    const userInput = document.getElementById('userInput');
    userInput.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    userInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    /* ── Helpers ────────────────────────────────────────────────────────────── */
    function setStatus(text, color) {
      const el = document.getElementById('statusDot');
      el.style.cssText =
        `color:${color};box-shadow: 'none'};`;
      el.textContent = ' ' + text;
    }

    function addMessage(role, content) {
      const container = document.getElementById('chatContainer');
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      const inner = document.createElement('div');
      inner.className = 'message-content';
      inner.innerHTML = content;
      msg.appendChild(inner);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return inner;
    }

    /* ── Send ───────────────────────────────────────────────────────────────── */
    async function sendMessage() {
      const sendBtn   = document.getElementById('sendBtn');
      const query     = userInput.value.trim();
      if (!query) return;

      const library = document.querySelector('input[name="library"]:checked').value;
      const mode    = document.querySelector('input[name="mode"]:checked').value;
      const currentCode = monacoEditor ? monacoEditor.getValue().trim() || null : null;

      addMessage('user', query);
      userInput.value = '';
      userInput.style.height = 'auto';

      sendBtn.disabled = true;
      sendBtn.innerHTML = '<span class="spinner"></span> 生成中…';
      setStatus('生成中', '#f59e0b');

      const loadingText = mode === 'tool-call'
        ? '正在查阅文档并生成代码'
        : '正在检索 Skills 并生成代码';

      const lastMsgContent = addMessage('assistant',
        `<span class="loading"><span class="spinner"></span>${loadingText}</span>`);

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, library, currentCode, mode })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Generation failed' }));
          throw new Error(err.error || 'Generation failed');
        }

        const data = await res.json();
        const { code, library: lib, skills = [], toolCallsCount } = data;

        if (monacoEditor) {
          isSettingValue = true;
          monacoEditor.setValue(code || '');
          isSettingValue = false;
        }

        const badge = `<span class="mode-badge ${mode}">${mode === 'tool-call' ? 'Tool Call' : 'BM25'}</span>`;
        const note  = mode === 'tool-call'
          ? `工具调用 ${toolCallsCount} 次 · 加载 ${skills.length} 个 Skill`
          : `检索到 ${skills.length} 个相关 Skill`;

        lastMsgContent.innerHTML =
          `代码已生成 &nbsp;·&nbsp; <strong>${lib.toUpperCase()}</strong> ${badge}<br>` +
          `<span style="font-size:11px;color:var(--text-tertiary)">${note}</span>`;

        // Panel badge
        const panelBadge = document.getElementById('modeBadgePanel');
        panelBadge.className = `panel-badge ${mode}`;
        panelBadge.textContent = mode === 'tool-call' ? 'Tool Call' : 'BM25';
        panelBadge.style.display = 'inline-flex';

        if (skills.length > 0) {
          document.getElementById('skillsList').innerHTML =
            skills.map(s => `<li>${s.title}</li>`).join('');
          document.getElementById('skillsInfo').style.display = 'block';
        }

        setStatus('就绪', 'var(--green)');
        setTimeout(() => runCode(), 300);

      } catch (err) {
        lastMsgContent.closest('.message').className = 'message error';
        lastMsgContent.innerHTML = `<strong>生成失败</strong><br>${err.message}`;
        setStatus('错误', 'var(--red)');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = `
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:13px;height:13px">
            <path d="M8 2L14 8L8 14M2 8H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg> 发送`;
      }
    }

    /* ── Run code ───────────────────────────────────────────────────────────── */
    function runCode() {
      const code = monacoEditor ? monacoEditor.getValue() : '';
      if (!code.trim()) return;

      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      if (graphInstance) { graphInstance.destroy(); graphInstance = null; }

      const container = document.getElementById('container');
      container.innerHTML = '';
      container.style.display = 'block';
      document.getElementById('placeholder').style.display = 'none';

      try {
        let t = code
          .replace(/import\s*\{[^}]*\}\s*from\s*['"]@antv\/g2['"];?/g, '')
          .replace(/import\s*\{[^}]*\}\s*from\s*['"]@antv\/g6['"];?/g, '')
          .replace(/import\s+\w+\s+from\s*['"]@antv\/g2['"];?/g, '')
          .replace(/import\s+\w+\s+from\s*['"]@antv\/g6['"];?/g, '')
          .replace(/import\s*\*\s*as\s+\w+\s*from\s*['"]@antv\/g2['"];?/g, '')
          .replace(/import\s*\*\s*as\s+\w+\s*from\s*['"]@antv\/g6['"];?/g, '')
          .replace(/container:\s*['"]container['"]/g, 'container: container');

        const isG6 = code.includes('@antv/g6') || code.includes('new Graph(');
        const exec = isG6
          ? `const { Graph } = window.G6;\n${t}`
          : `const { Chart } = window.G2;\n${t}`;

        new Function('container', exec)(container);
        setStatus('预览已更新', 'var(--green)');
      } catch (e) {
        console.error(e);
        container.innerHTML = `<div class="error-block"><strong>运行错误</strong><br>${e.message}</div>`;
        setStatus('运行错误', 'var(--red)');
      }
    }

    /* ── Toolbar actions ────────────────────────────────────────────────────── */
    function copyCode() {
      const code = monacoEditor ? monacoEditor.getValue() : '';
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.toolbar-btn[onclick="copyCode()"]');
        const orig = btn.innerHTML;
        btn.innerHTML = btn.innerHTML.replace('复制', '已复制 ✓');
        setTimeout(() => { btn.innerHTML = orig; }, 1500);
      });
    }

    function formatCode() {
      if (monacoEditor) monacoEditor.getAction('editor.action.formatDocument')?.run();
    }

    function clearCode() {
      if (monacoEditor) {
        isSettingValue = true;
        monacoEditor.setValue('');
        isSettingValue = false;
      }
      const container = document.getElementById('container');
      container.innerHTML = '';
      container.style.display = 'none';
      document.getElementById('placeholder').style.display = 'block';
      document.getElementById('skillsInfo').style.display = 'none';
      document.getElementById('modeBadgePanel').style.display = 'none';
      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      if (graphInstance) { graphInstance.destroy(); graphInstance = null; }
      setStatus('就绪', 'var(--text-tertiary)');
    }
  </script>
</body>
</html>
